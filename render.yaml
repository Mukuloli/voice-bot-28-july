services:
  - type: web
    name: voice-bot-28
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - key: VOICE_NAME
        value: Kore
      - key: PYTHONPATH
        value: backend
